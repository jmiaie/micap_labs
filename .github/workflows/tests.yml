name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # No third-party runtime deps; run the suite with the stdlib unittest
      # runner so CI needs nothing installed.
      - name: Run tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -p "test_*.py" -v
