[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rallycap"
version = "0.1.0"
description = "Polymarket MLB in-game mean-reversion trading bot (edge-gated underdog strategy)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",          # feeds only; strategy math is stdlib-only
]

[project.optional-dependencies]
live = [
    "py-clob-client>=0.17", # official Polymarket CLOB client (M4)
]
dev = [
    "pytest>=8",
]

[project.scripts]
rallycap = "rallycap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
