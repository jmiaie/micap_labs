name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rallycap-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rallycap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/ -q
      - name: Synthetic backtest smoke run
        run: PYTHONPATH=src python -m rallycap.cli backtest --games 50 --seed 7
